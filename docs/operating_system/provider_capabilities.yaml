providers:
  codex:
    entrypoint: AGENTS.md
    runtime_root: ~/.codex
    rules_format: codex-rules
    lifecycle_hooks: false
    fallback: root_instructions_and_host_adapter
  claude:
    entrypoint: CLAUDE.md
    runtime_root: ~/.claude
    rules_format: markdown
    lifecycle_hooks: true
    settings_output: settings.json
    supported_events:
      - PreToolUse
      - PostToolUse
      - Stop
      - UserPromptSubmit
  antigravity:
    entrypoint: GEMINI.md
    runtime_root: ~/.gemini
    antigravity_root: ~/.gemini/antigravity
    rules_format: markdown
    lifecycle_hooks: false
    fallback: rules_workflows
