schema_version: 1
provider: claude
runtime:
  entrypoint: CLAUDE.md
  root: ~/.claude
hooks:
  enabled: true
  output: settings_json
  events:
    task_start:
      enabled: false
      provider_event: UserPromptSubmit
      blocking: false
      timeout_seconds: 30
      commands: []
    task_end:
      enabled: true
      provider_event: Stop
      blocking: true
      timeout_seconds: 60
      commands:
        - python scripts/hooks/run_validator.py --fast
    error:
      enabled: false
      provider_event: SubagentStop
      blocking: false
      timeout_seconds: 30
      commands: []
    pre_tool:
      enabled: false
      provider_event: PreToolUse
      blocking: false
      timeout_seconds: 30
      commands: []
    post_tool:
      enabled: false
      provider_event: PostToolUse
      blocking: false
      timeout_seconds: 30
      commands: []
settings:
  approval_mode: prompt
  shell_timeout_seconds: 120
