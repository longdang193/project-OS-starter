name: Repo Hooks

on:
  push:
  pull_request:

defaults:
  run:
    shell: pwsh

jobs:
  adapter-integrity:
    name: Adapter Integrity
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect adoption mode
        id: adoption_mode
        run: |
          $match = Select-String -Path repo_config/adoption-mode.yaml -Pattern '^adoption_mode:\s*(.+)$'
          if (-not $match) {
            throw "Unable to determine adoption_mode from repo_config/adoption-mode.yaml"
          }
          $mode = $match.Matches[0].Groups[1].Value.Trim()
          "value=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python 3.11
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Skip adapter-integrity for starter_method_only
        if: steps.adoption_mode.outputs.value == 'starter_method_only'
        run: Write-Host "Skipping source-owned adapter integrity checks for starter_method_only repos."

      - name: Sync adapter outputs
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        run: .\scripts\sync_agent_adapters.ps1

      - name: Verify adapter outputs
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        run: .\scripts\verify_agent_adapters.ps1

      - name: Fail on untracked generated outputs
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        run: |
          $paths = @(
            (Get-Content -Raw repo_config/agent-adapter-mappings.json | ConvertFrom-Json | ForEach-Object {
              $_.destination
            })
          )
          $untracked = git ls-files --others --exclude-standard -- $paths
          if ($untracked) {
            Write-Host "Untracked generated outputs detected:"
            $untracked | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - name: Fail on generated drift
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        run: git diff --exit-code

  baseline-tests:
    name: Baseline Tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect adoption mode
        id: adoption_mode
        run: |
          $match = Select-String -Path repo_config/adoption-mode.yaml -Pattern '^adoption_mode:\s*(.+)$'
          if (-not $match) {
            throw "Unable to determine adoption_mode from repo_config/adoption-mode.yaml"
          }
          $mode = $match.Matches[0].Groups[1].Value.Trim()
          "value=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Run architecture sync check
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        run: python scripts/sync_architecture_docs.py --check

      - name: Skip architecture sync for starter_method_only
        if: steps.adoption_mode.outputs.value == 'starter_method_only'
        run: Write-Host "Skipping source-owned architecture sync check for starter_method_only repos."

      - name: Run baseline test command
        run: |
          if (Test-Path tests) {
            python -m pytest
          } else {
            Write-Host "No tests directory found. Update this workflow during bootstrap if your project uses a different baseline test command."
          }

  publication-boundary:
    name: Publication Boundary
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect adoption mode
        id: adoption_mode
        run: |
          $match = Select-String -Path repo_config/adoption-mode.yaml -Pattern '^adoption_mode:\s*(.+)$'
          if (-not $match) {
            throw "Unable to determine adoption_mode from repo_config/adoption-mode.yaml"
          }
          $mode = $match.Matches[0].Groups[1].Value.Trim()
          "value=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python 3.11
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path tests) {
            python -m pip install pytest pytest-httpx
          }
          if ((Test-Path pyproject.toml) -or (Test-Path setup.py)) {
            python -m pip install -e .
          }

      - name: Skip publication-boundary for starter_method_only
        if: steps.adoption_mode.outputs.value == 'starter_method_only'
        run: Write-Host "Skipping source-owned publication-boundary checks for starter_method_only repos."

      - name: Run publication boundary dry check
        if: steps.adoption_mode.outputs.value != 'starter_method_only'
        run: .\scripts\publish_public_repo.ps1
