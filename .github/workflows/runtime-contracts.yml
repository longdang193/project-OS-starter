name: Runtime contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: >-
          python -m pytest -q
          tests/test_project_os_runtime.py
          tests/test_project_os_reconciliation.py
          tests/test_reconciliation.py
          tests/test_evidence_release.py
          tests/test_plan_preparation.py
          tests/test_deepagents_result_contract.py
          tests/test_deepagents_runtime_patch.py
          tests/test_dcode_project.py
          tests/test_deploy_agent_runtime.py
          tests/test_herdr_attempt_contract.py
          tests/test_herdr_main_launcher.py
          tests/test_herdr_parallel_dispatch.py
          tests/test_setup_deepagents_runtime_contract.py
          tests/test_secretary_evidence.py
          tests/test_secretary_adapter.py
          tests/test_secretary_receipts.py
          tests/test_secretary_live_runtime.py
          tests/test_secretary_live_pilot.py

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-benchmark.txt
      - run: python -m pytest tests/test_worker_contract_benchmark.py -q
