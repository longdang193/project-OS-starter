version: 3
defaults:
  workspace: current
  approval_gates: []
states:
  classified: [planned, blocked]
  planned: [running, awaiting_decision, blocked]
  running: [observed, awaiting_decision, blocked]
  observed: [verifying, running, blocked]
  verifying: [awaiting_decision, accepted, blocked]
  awaiting_decision: [awaiting_decision, planned, accepted, unvalidated, blocked]
  accepted: []
  unvalidated: []
  blocked: []
retry_policies:
  bounded:
    max_attempts: 2
    retryable_reasons: [check_failed, dispatch_failed, claim_invalid, verification_failed, review_required]
    exhaustion: block
    approval_resume: successor_attempt
    approval_ttl_seconds: 3600
checks:
  diff:
    command: [git, diff, --check]
tools:
  shell:
    optional: false
    host_kind: app_server_shell
    writer_access: workspace_write
    validator_access: read_only
    root_probe: shell_root_probe
  serena:
    optional: true
    host_kind: local_serena
    writer_access: workspace_write
    validator_access: read_only
    root_probe: serena_root_probe
  semble_codebase_search:
    optional: true
    fallback: [shell, serena]
    host_kind: local_semble
    writer_access: read_only
    validator_access: read_only
    root_probe: semble_root_probe
  ast_grep_preview:
    optional: true
    fallback: [shell]
    host_kind: local_ast_grep
    writer_access: read_only
    validator_access: read_only
    root_probe: ast_grep_root_probe
approval_gates:
  protected_policy:
    paths: [agents/**, repo_config/harness.yaml, docs/operating_system/rules/**]
orchestration:
  single_work_lane:
    aliases: [single_agent]
    work_scheduling: single
    max_parallel_writers: 1
    workspace_mode: isolated
    validator_role: validate
    review_required: false
    rules: []
  sequential_work_lanes:
    aliases: [sequential_agents]
    work_scheduling: sequential
    max_parallel_writers: 1
    workspace_mode: isolated
    validator_role: validate
    review_required: true
    rules: [multi-agent-orchestration-rule]
  parallel_work_lanes:
    aliases: [parallel_lanes]
    work_scheduling: parallel
    max_parallel_writers: 4
    workspace_mode: isolated
    validator_role: validate
    review_required: true
    rules: [multi-agent-orchestration-rule]
routes:
  local_change:
    template: normal
    role: implement
    rules: [command-execution-rule, python-contracts-rule]
    skills: [skill-code-standards, skill-test-driven-development]
    tools: [shell, serena, ast_grep_preview]
    workspace: current
    checks: [diff]
    approval_gates: [protected_policy]
    retry_policy: bounded
    execution_modes: [single_work_lane, sequential_work_lanes, parallel_work_lanes]
  debugging:
    template: normal
    role: investigate
    rules: [command-execution-rule]
    skills: [skill-systematic-debugging]
    tools: [shell, serena, ast_grep_preview]
    workspace: current
    checks: [diff]
    retry_policy: bounded
    execution_modes: [single_work_lane, sequential_work_lanes]
  research:
    template: low
    role: investigate
    rules: [command-execution-rule]
    skills: [skill-brainstorming]
    tools: [shell, semble_codebase_search]
    workspace: current
    checks: [diff]
    retry_policy: bounded
    execution_modes: [single_work_lane, parallel_work_lanes]
  plan_review:
    template: high
    role: review
    rules: [doc-contracts-rule]
    skills: [skill-plan-document-reviewer]
    tools: [shell, serena]
    workspace: current
    checks: [diff]
    retry_policy: bounded
    execution_modes: [single_work_lane, sequential_work_lanes]
  harness_improvement:
    template: high
    role: improve
    rules: [command-execution-rule, doc-contracts-rule]
    skills: [skill-improve-harness, skill-writing-skills]
    tools: [shell, serena]
    workspace: current
    checks: [diff]
    approval_gates: [protected_policy]
    retry_policy: bounded
    execution_modes: [single_work_lane, sequential_work_lanes]
