version: 3
harness_core:
  request_api: 4
capabilities:
  catalog: [repo.read, repo.write, checks.run, code.search, docs.query, harness.delegate]
  sets:
    read_only: [repo.read, code.search, docs.query]
    workspace_write: [repo.read, repo.write, checks.run, code.search]
context_limits:
  objective_max_bytes: 4096
  fact_max_bytes: 16384
  max_facts: 16
  max_artifacts: 16
  outcome_summary_max_bytes: 4096
evidence_artifacts:
  writer_retained_kinds: [sanitized_command_trace]
  sanitized_command_trace_max_bytes: 4096
delegation_profiles:
  disabled:
    max_depth: 0
    max_children: 0
    max_concurrent_children: 0
    per_child_timeout_seconds: 0
    total_child_timeout_seconds: 0
    allowed_roles: []
    capability_ceiling: []
    workspace_write_access: read_only
    verification: none
  read_only_research:
    max_depth: 1
    max_children: 2
    max_concurrent_children: 1
    per_child_timeout_seconds: 120
    total_child_timeout_seconds: 240
    allowed_roles: [investigate, review]
    capability_ceiling: [repo.read, code.search, docs.query]
    workspace_write_access: read_only
    verification: schema
defaults:
  workspace: current
  approval_gates: []
execution_budgets:
  max_turn_timeout_seconds: 900
  profiles:
    default:
      turn_timeout_seconds: 300
      timeout_decisions: [escalate, block]
      escalation_profile: extended
    extended:
      turn_timeout_seconds: 900
      timeout_decisions: [block]
states:
  classified: [planned, blocked]
  planned: [running, awaiting_decision, blocked]
  running: [observed, awaiting_decision, blocked]
  observed: [verifying, running, blocked]
  verifying: [awaiting_decision, accepted, blocked]
  awaiting_decision: [awaiting_decision, planned, accepted, unvalidated, blocked]
  accepted: []
  unvalidated: []
  blocked: []
retry_policies:
  bounded:
    max_attempts: 2
    retryable_reasons: [check_failed, dispatch_failed, claim_invalid, verification_failed, review_required]
    exhaustion: block
    approval_resume: successor_attempt
    approval_ttl_seconds: 3600
checks:
  diff:
    command: [git, diff, --check]
tools:
  shell:
    optional: false
    host_kind: app_server_shell
    writer_access: workspace_write
    validator_access: read_only
    root_probe: shell_root_probe
  serena:
    optional: true
    host_kind: local_serena
    writer_access: workspace_write
    validator_access: read_only
    root_probe: serena_root_probe
  semble_codebase_search:
    optional: true
    fallback: [shell, serena]
    host_kind: local_semble
    writer_access: read_only
    validator_access: read_only
    root_probe: semble_root_probe
  ast_grep_preview:
    optional: true
    fallback: [shell]
    host_kind: local_ast_grep
    writer_access: read_only
    validator_access: read_only
    root_probe: ast_grep_root_probe
runtime_providers:
  codex_app_server:
    contract_version: 3
friction_policy:
  event_version: 1
  minimum_distinct_runs: 3
  window_days: 14
  follow_up_routes:
    writer_completion_missing: harness_diagnosis
approval_gates:
  protected_policy:
    paths: [agents/**, .agents/skills/**, repo_config/harness.yaml, docs/operating_system/rules/**]
orchestration:
  single_work_lane:
    aliases: [single_agent]
    work_scheduling: single
    max_parallel_writers: 1
    workspace_mode: isolated
    validator_role: validate
    review_required: false
    rules: []
  sequential_work_lanes:
    aliases: [sequential_agents]
    work_scheduling: sequential
    max_parallel_writers: 1
    workspace_mode: isolated
    validator_role: validate
    review_required: true
    rules: [multi-agent-orchestration-rule]
  parallel_work_lanes:
    aliases: [parallel_lanes]
    work_scheduling: parallel
    max_parallel_writers: 4
    workspace_mode: isolated
    validator_role: validate
    review_required: true
    rules: [multi-agent-orchestration-rule]
routes:
  local_change:
    template: normal
    role: implement
    rules: [command-execution-rule, python-contracts-rule]
    skills: [skill-code-standards, skill-test-driven-development]
    tools: [shell, serena, ast_grep_preview]
    capabilities: [repo.read, repo.write, checks.run, code.search]
    delegation_profile: disabled
    workspace: current
    checks: [diff]
    approval_gates: [protected_policy]
    retry_policy: bounded
    execution_budget_profile: default
    execution_modes: [single_work_lane, sequential_work_lanes, parallel_work_lanes]
    runtime_providers: [codex_app_server]
    default_runtime_provider: codex_app_server
  debugging:
    template: normal
    role: investigate
    rules: [command-execution-rule]
    skills: [skill-systematic-debugging]
    tools: [shell, serena, ast_grep_preview]
    capabilities: [repo.read, code.search, docs.query]
    delegation_profile: disabled
    workspace: current
    checks: [diff]
    retry_policy: bounded
    execution_budget_profile: default
    execution_modes: [single_work_lane, sequential_work_lanes]
    runtime_providers: [codex_app_server]
    default_runtime_provider: codex_app_server
  harness_diagnosis:
    template: high
    role: investigate
    rules: [command-execution-rule]
    skills: [skill-improve-harness, skill-systematic-debugging, skill-repository-research, skill-verification-before-completion]
    tools: [shell, serena]
    capabilities: [repo.read, code.search, docs.query]
    delegation_profile: disabled
    workspace: current
    readonly_artifacts:
      allowed_kinds: [terminal_observation, sanitized_command_trace]
      required_kinds: [terminal_observation]
    checks: [diff]
    retry_policy: bounded
    execution_budget_profile: default
    execution_modes: [single_work_lane, sequential_work_lanes]
    runtime_providers: [codex_app_server]
    default_runtime_provider: codex_app_server
  research:
    template: low
    role: investigate
    rules: [command-execution-rule]
    skills: [skill-repository-research]
    tools: [shell, semble_codebase_search]
    capabilities: [repo.read, code.search, docs.query, harness.delegate]
    delegation_profile: read_only_research
    workspace: current
    checks: [diff]
    retry_policy: bounded
    execution_budget_profile: default
    execution_modes: [single_work_lane, parallel_work_lanes]
    runtime_providers: [codex_app_server]
    default_runtime_provider: codex_app_server
  plan_review:
    template: high
    role: review
    rules: [doc-contracts-rule]
    skills: [skill-plan-document-reviewer]
    tools: [shell, serena]
    capabilities: [repo.read, code.search, docs.query]
    delegation_profile: disabled
    workspace: current
    checks: [diff]
    retry_policy: bounded
    execution_budget_profile: default
    execution_modes: [single_work_lane, sequential_work_lanes]
    runtime_providers: [codex_app_server]
    default_runtime_provider: codex_app_server
  design_exploration:
    template: high
    role: investigate
    rules: [command-execution-rule]
    skills: [skill-brainstorming]
    tools: [shell, semble_codebase_search]
    capabilities: [repo.read, code.search, docs.query]
    delegation_profile: disabled
    workspace: current
    checks: [diff]
    retry_policy: bounded
    execution_budget_profile: default
    execution_modes: [single_work_lane, sequential_work_lanes]
    runtime_providers: [codex_app_server]
    default_runtime_provider: codex_app_server
  plan_writing:
    template: high
    role: implement
    rules: [doc-contracts-rule]
    skills: [skill-writing-plans]
    tools: [shell, serena]
    capabilities: [repo.read, repo.write, checks.run, code.search]
    delegation_profile: disabled
    workspace: current
    checks: [diff]
    retry_policy: bounded
    execution_budget_profile: default
    execution_modes: [single_work_lane, sequential_work_lanes]
    runtime_providers: [codex_app_server]
    default_runtime_provider: codex_app_server
  skill_authoring:
    template: high
    role: implement
    rules: [command-execution-rule, doc-contracts-rule]
    skills: [skill-writing-skills, skill-test-driven-development, skill-verification-before-completion]
    tools: [shell, serena]
    capabilities: [repo.read, repo.write, checks.run, code.search]
    delegation_profile: disabled
    workspace: current
    checks: [diff]
    approval_gates: [protected_policy]
    retry_policy: bounded
    execution_budget_profile: default
    execution_modes: [single_work_lane, sequential_work_lanes]
    runtime_providers: [codex_app_server]
    default_runtime_provider: codex_app_server
  harness_improvement:
    template: high
    role: improve
    rules: [command-execution-rule, doc-contracts-rule]
    skills: [skill-improve-harness, skill-code-standards, skill-test-driven-development, skill-verification-before-completion]
    tools: [shell, serena]
    capabilities: [repo.read, repo.write, checks.run, code.search]
    delegation_profile: disabled
    workspace: current
    checks: [diff]
    approval_gates: [protected_policy]
    retry_policy: bounded
    execution_budget_profile: default
    execution_modes: [single_work_lane, sequential_work_lanes]
    runtime_providers: [codex_app_server]
    default_runtime_provider: codex_app_server
