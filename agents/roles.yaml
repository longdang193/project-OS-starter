version: 2
roles:
  implement:
    accepts: [low, normal, high]
    result_kind: claimed_result
    required_fields: [summary, changed_files]
  investigate:
    accepts: [low, normal, high]
    result_kind: claimed_result
    required_fields: [summary, findings]
  review:
    accepts: [normal, high]
    result_kind: claimed_result
    required_fields: [summary, findings]
  validate:
    accepts: [low, normal, high]
    result_kind: claimed_result
    required_fields: [summary, findings, verdict]
    field_constraints:
      verdict: [pass, fail]
  improve:
    accepts: [normal, high]
    result_kind: claimed_result
    required_fields: [summary, changed_files, decision]
