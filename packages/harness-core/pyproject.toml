[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-core"
version = "0.1.6"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
harness-core = "harness_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
