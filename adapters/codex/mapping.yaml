platform: codex
mappings:
  - source: AGENTS.md
    destination: generated_agents/codex/AGENTS.md
    mode: render_root_doc_with_manifest
    comment_prefix: "#"
  - source: docs/operating_system/rules/global-baseline-contract-rule.md
    destination: generated_agents/codex/rules/global-baseline-contract.rules
    mode: render_codex_rule_file
    comment_prefix: "#"
  - source: docs/operating_system/rules
    destination: .agents/rules
    mode: copy_tree
    include_glob: "*.md"
    comment_prefix: "#"
  - source: .agents/skills
    destination: generated_agents/codex/skills
    mode: copy_tree
    include_glob: "*/SKILL.md"
    comment_prefix: "#"
