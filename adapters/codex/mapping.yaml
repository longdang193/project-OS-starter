platform: codex
mappings:
  - source: AGENTS.md
    destination: generated_agents/codex/AGENTS.md
    mode: copy_file
    comment_prefix: "#"
  - source: docs/operating_system/rules
    destination: .agents/rules
    mode: copy_tree
    include_glob: "*.md"
    comment_prefix: "#"
  - source: .agents/skills
    destination: generated_agents/codex/skills
    mode: copy_tree
    include_glob: "**/*"
    comment_prefix: "#"
  - source: agents
    destination: generated_agents/codex/agents
    mode: render_codex_agents_tree
    include_glob: "*.toml"
    comment_prefix: "#"
