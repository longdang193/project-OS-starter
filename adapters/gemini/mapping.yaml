platform: antigravity
mappings:
  - source: docs/operating_system/rules/global-baseline-contract-rule.md
    destination: generated_agents/antigravity/rules/global-baseline-contract-rule.md
    mode: copy_file
    comment_prefix: "#"
  - source: docs/operating_system/rules
    destination: .agents/rules
    mode: copy_tree
    include_glob: "*.md"
    comment_prefix: "#"
  - source: docs/operating_system/workflows
    destination: generated_agents/antigravity/skills
    mode: render_workflow_skills_tree
    include_glob: "*.md"
    comment_prefix: "#"
  - source: .agents/skills
    destination: generated_agents/antigravity/skills
    mode: copy_tree
    include_glob: "*/SKILL.md"
    comment_prefix: "#"
