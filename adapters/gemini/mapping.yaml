platform: antigravity
mappings:
  - source: AGENTS.md
    destination: generated_agents/antigravity/GEMINI.md
    mode: copy_file
    comment_prefix: "#"
  - source: docs/operating_system/rules
    destination: .agents/rules
    mode: copy_tree
    include_glob: "*.md"
    comment_prefix: "#"
  - source: .agents/skills
    destination: generated_agents/antigravity/skills
    mode: copy_tree
    include_glob: "**/*"
    comment_prefix: "#"
