platform: claude
mappings:
  - source: AGENTS.md
    destination: generated_agents/claude/CLAUDE.md
    comment_prefix: "#"
  - source: docs/operating_system/provider_settings/claude.yaml
    destination: generated_agents/claude/settings.json
    mode: render_claude_settings_from_yaml
    comment_prefix: "#"
  - source: docs/operating_system/rules
    destination: generated_agents/claude/rules
    mode: copy_tree
    include_glob: "*.md"
    comment_prefix: "#"
  - source: docs/operating_system/rules
    destination: .agents/rules
    mode: copy_tree
    include_glob: "*.md"
    comment_prefix: "#"
  - source: docs/operating_system/workflows
    destination: generated_agents/claude/workflows
    mode: copy_tree
    include_glob: "*.md"
    comment_prefix: "#"
  - source: docs/operating_system/workflows
    destination: .agents/workflows
    mode: copy_tree
    include_glob: "*.md"
    comment_prefix: "#"
  - source: docs/operating_system/prompt_templates
    destination: generated_agents/claude/prompt_templates
    mode: copy_tree
    comment_prefix: "#"
  - source: docs/operating_system
    destination: generated_agents/claude/operating_system
    mode: copy_tree
    include_glob: "**/*.md"
    comment_prefix: "#"
  - source: .agents/skills
    destination: generated_agents/claude/skills
    mode: copy_tree
    include_glob: "*/SKILL.md"
    comment_prefix: "#"
