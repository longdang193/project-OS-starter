                        - cell "Worker 2" [ref=e489]
                - generic [ref=e490]:
                  - generic [ref=e491]:
                    - generic [ref=e492]:
                      - button "Copy the contents from the code block" [ref=e493] [cursor=pointer]
                      - status [ref=e497]
                    - button "Ask Assistant" [ref=e499] [cursor=pointer]
                  - code [ref=e506]:
                    - generic [ref=e507]: export AGENT_SERVER_USE_HOST_NETWORK=true
                - generic [ref=e508]: This lets you add a single static reverse-proxy route for each fixed port.
                - note "Warning" [ref=e509]:
                  - generic [ref=e514]:
                    - text: Host-network mode binds every sandbox to the
                    - strong [ref=e515]: same
                    - text: fixed host ports. Only one sandbox can run at a time; concurrent conversations will collide on those ports. OpenHands logs a warning if host networking is enabled with
                    - code [ref=e516]: max_num_sandboxes > 1
                    - text: .
