                - heading "Navigate to header Self-hosting Behind a Reverse Proxy" [level=2] [ref=e434]:
                  - link "Navigate to header" [ref=e435] [cursor=pointer]:
                    - /url: "#self-hosting-behind-a-reverse-proxy"
                  - generic [ref=e440] [cursor=pointer]: Self-hosting Behind a Reverse Proxy
                - generic [ref=e441]:
                  - text: When you self-host OpenHands behind a reverse proxy (nginx, Traefik, etc.), each Docker sandbox exposes its agent-server (and VS Code / worker) ports on a
                  - strong [ref=e442]: randomly assigned host port
                  - text: . The frontend reaches the sandbox by plugging that random port into the
                  - code [ref=e443]: container_url_pattern
                  - text: ", which defaults to"
                  - code [ref=e444]: "http://localhost:{port}"
                  - text: ". Two things break for a typical reverse-proxy setup:"
                - list [ref=e445]:
                  - listitem [ref=e446]:
                    - text: The hostname is
                    - code [ref=e447]: localhost
                    - text: ", not your public domain."
                  - listitem [ref=e448]: The port is random, so you cannot add a static proxy route for it.
                - note "Note" [ref=e449]:
                  - generic [ref=e454]:
                    - code [ref=e455]: OH_WEB_URL
                    - text: does
                    - strong [ref=e456]: not
                    - text: control these sandbox URLs. On the OpenHands host it only adds the origin to the sandbox’s CORS allow-list — it is not forwarded into the sandbox container’s environment, so it has no effect on the host/port the browser uses to reach a sandbox.
                - heading "Navigate to header Pin sandbox ports with host networking" [level=3] [ref=e457]:
                  - link "Navigate to header" [ref=e458] [cursor=pointer]:
                    - /url: "#pin-sandbox-ports-with-host-networking"
                  - generic [ref=e463] [cursor=pointer]: Pin sandbox ports with host networking
                - generic [ref=e464]:
                  - text: Set
                  - code [ref=e465]: AGENT_SERVER_USE_HOST_NETWORK=true
                  - text: "to run agent-server containers in Docker host-network mode. Instead of random host ports, each container’s ports are reachable directly on fixed host ports:"
                - region "Scrollable table" [ref=e466]:
                  - table [ref=e468]:
                    - rowgroup [ref=e469]:
                      - row [ref=e470]:
                        - columnheader "Container port" [ref=e471]
